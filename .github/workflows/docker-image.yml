name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag wetlettuce/robot:$(date +%s)
    - name: Run the ROS Tests
      run: |
        docker run -it \
        --privileged \
        --net=host \
        -v /dev:/dev/ \
        -v /run/udev/:/run/udev/ \
        --group-add video \
        -e HOME=/tpm \
        maze/ros \
        colcon test --event-handlers console_direct+
